services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onenote-net

  server:
    image: ${DOCKER_IMAGE_SERVER:-onenote-server:latest}
    build: ./server
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PORT: 3001
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - onenote-net

  client:
    image: ${DOCKER_IMAGE_CLIENT:-onenote-client:latest}
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    restart: always
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - server
    networks:
      - onenote-net

volumes:
  # Named persistent volume — DB data survives container rebuilds & redeploys
  postgres_data:
    name: onenote_postgres_data
    driver: local

networks:
  onenote-net:
    driver: bridge
