name: Deploy OneNote to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_PATH: /opt/onenote

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        run: npm run build

  deploy:
    name: Deploy to Server
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Generate .env file from secrets
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          APP_PORT: ${{ secrets.APP_PORT }}
        run: |
          printf 'DB_NAME=%s\nDB_USER=%s\nDB_PASSWORD=%s\nAPP_PORT=%s\n' \
            "$DB_NAME" "$DB_USER" "$DB_PASSWORD" "$APP_PORT" > .env

      - name: Add server to known hosts
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Copy files to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync

          sshpass -e rsync -avz --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'client/dist' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ "${SERVER_USER}@${SERVER_HOST}:${{ env.DEPLOY_PATH }}/"

          sshpass -e scp -o StrictHostKeyChecking=no \
            .env "${SERVER_USER}@${SERVER_HOST}:${{ env.DEPLOY_PATH }}/.env"

      - name: Deploy with Docker Compose
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no \
            "${SERVER_USER}@${SERVER_HOST}" bash -s << 'REMOTE'
          set -e
          cd /opt/onenote

          if ! command -v docker &> /dev/null; then
            curl -fsSL https://get.docker.com | sh
            sudo usermod -aG docker "$USER"
          fi

          if ! docker compose version &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y docker-compose-plugin
          fi

          docker compose -f docker-compose.prod.yml down || true
          docker compose -f docker-compose.prod.yml build --no-cache
          docker compose -f docker-compose.prod.yml up -d

          sleep 15
          docker compose -f docker-compose.prod.yml ps
          REMOTE

      - name: Verify deployment
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no \
            "${SERVER_USER}@${SERVER_HOST}" \
            "curl -sf http://localhost/api/health || curl -sf http://localhost:80/api/health"
          echo "Deployment verified successfully!"
